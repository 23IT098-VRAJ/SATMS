{% extends "base.html" %}

{% block title %}Login - Smart Traffic Management{% endblock %}

{% block content %}
<div class="auth-form">
    <h2><i class="fas fa-sign-in-alt me-2"></i>Login</h2>
    <div id="alert-container"></div>
    <form method="POST" action="{{ url_for('api_login') }}" id="login-form">
        <div class="mb-3">
            <label for="email" class="form-label">Email address</label>
            <div class="input-group">
                <span class="input-group-text">
                    <i class="fas fa-envelope"></i>
                </span>
                <input type="email" class="form-control" id="email" name="email" placeholder="Enter your email" required>
            </div>
        </div>
        <div class="mb-4">
            <label for="password" class="form-label">Password</label>
            <div class="input-group">
                <span class="input-group-text">
                    <i class="fas fa-lock"></i>
                </span>
                <input type="password" class="form-control" id="password" name="password" placeholder="Enter your password" required>
            </div>
        </div>
        <div class="d-grid">
            <button type="submit" class="btn btn-primary">
                <i class="fas fa-sign-in-alt me-2"></i>Login
            </button>
        </div>
    </form>
    <div class="text-center mt-4">
        <p>Don't have an account? <a href="{{ url_for('register_page') }}">Register here</a></p>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
function showAlert(message, type = 'danger') {
    const alertContainer = document.getElementById('alert-container');
    alertContainer.innerHTML = `
        <div class="alert alert-${type} alert-dismissible fade show" role="alert">
            ${type === 'success' ? '<i class="fas fa-check-circle me-2"></i>' : '<i class="fas fa-exclamation-circle me-2"></i>'}
            ${message}
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
    `;
}

document.getElementById('login-form').addEventListener('submit', async function(e) {
    e.preventDefault();
    
    try {
        const submitBtn = this.querySelector('button[type="submit"]');
        submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i>Logging in...';
        submitBtn.disabled = true;
        
        const response = await fetch('/api/login', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify({
                email: document.getElementById('email').value,
                password: document.getElementById('password').value
            })
        });
        
        const data = await response.json();
        
        if (response.ok) {
            showAlert(data.message, 'success');
            setTimeout(() => {
                window.location.href = '/dashboard';
            }, 1000);
        } else {
            showAlert(data.error);
            submitBtn.innerHTML = '<i class="fas fa-sign-in-alt me-2"></i>Login';
            submitBtn.disabled = false;
        }
    } catch (error) {
        showAlert('An error occurred during login. Please try again.');
        const submitBtn = this.querySelector('button[type="submit"]');
        submitBtn.innerHTML = '<i class="fas fa-sign-in-alt me-2"></i>Login';
        submitBtn.disabled = false;
    }
});
</script>
{% endblock %}
